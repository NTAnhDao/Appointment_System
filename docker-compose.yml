services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev -- --host
  mongo:
    image: mongo
    ports:
      - "27017:27017"

  oracle:
    image: gvenzl/oracle-xe
    ports:
      - "1521:1521"