services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - oracle
      - redis
      - mongo
    environment:
      DB_USER: app
      DB_PASSWORD: 123456
      DB_CONNECT_STRING: oracle:1521/XEPDB1
      JWT_SECRET: abc123
      MONGO_URI: mongodb://mongo:27017/hospital_db
      TZ: UTC

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev -- --host

    volumes:
      - ./frontend:/app        # bind source code
      - /app/node_modules      # tránh ghi đè node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - TZ=UTC

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - TZ=UTC
      
  oracle:
    image: gvenzl/oracle-xe
    ports:
      - "1522:1521"
    environment:
      - ORACLE_PASSWORD=123456
      - TZ=UTC
    volumes:
      - ./database/oracle:/docker-entrypoint-initdb.d  
      - oracle-data:/opt/oracle/oradata 

  redis:
    image: redis
    ports:
      - "6379:6379"
      
volumes:
  oracle-data:
  mongo-data: